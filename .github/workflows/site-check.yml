name: site-check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate JSON files
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          bad = []
          for p in ["content/site.json", "package.json"]:
              if not pathlib.Path(p).is_file():
                  bad.append(f"missing: {p}")
                  continue
              try:
                  json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
              except Exception as e:
                  # never echo file contents; class + line only
                  line = getattr(e, "lineno", "?")
                  bad.append(f"invalid JSON: {p} (line {line})")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("JSON files valid")
          PY
      - name: Generic privacy scan (never prints matched values)
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          patterns = {
              "bearer-token": re.compile(r"Bearer\s+[A-Za-z0-9_\-\.=]{20,}"),
              "long-hex-secret": re.compile(r"\b[0-9a-fA-F]{40,64}\b"),
              "private-key-block": re.compile(r"-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----"),
              "api-key-assignment": re.compile(r"(?i)\b(api[_-]?key|secret|password|token)\b\s*[:=]\s*['\"][^'\"]{12,}['\"]"),
              "aws-access-key": re.compile(r"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b"),
              "google-oauth-refresh": re.compile(r"1//[A-Za-z0-9_\-]{40,}"),
              "slack-token": re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{10,}"),
              "github-token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}"),
          }
          # public trade identifiers (EORI/VAT, e.g. PL754307538800000) are not secrets
          _public_id = re.compile(r"\b[A-Z]{2}[0-9]{2}[0-9A-Z]{9,18}0{4}\b")
          hits = []
          for p in sorted(pathlib.Path(".").rglob("*")):
              if any(part in (".git", ".github", "node_modules", "assets") for part in p.parts):
                  continue
              if not p.is_file() or p.stat().st_size > 2_000_000:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              for name, rx in patterns.items():
                  for m in rx.finditer(text):
                      if _public_id.match(m.group(0).strip()):
                          continue
                      line = text[:m.start()].count("\n") + 1
                      # REPORT ONLY: pattern type, file, line. No matched value, no snippet.
                      hits.append(f"{name}: {p.as_posix()}:{line}")
          if hits:
              print("privacy scan findings (values withheld):")
              print("\n".join(hits)); sys.exit(1)
          print("no generic secret patterns found")
          PY
      - name: Check asset references exist
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          # /assets/* is served from the production webroot, sha-pinned elsewhere,
          # intentionally not tracked in this repo.
          missing = []
          for m in re.finditer(r'(?:src|href)="/([^"#?]+)', html):
              rel = m.group(1)
              if rel.startswith("assets/"):
                  continue
              if not pathlib.Path(rel).is_file():
                  missing.append(rel)
          if missing:
              print("missing referenced files:", ", ".join(missing)); sys.exit(1)
          print("all referenced assets present")
          PY
